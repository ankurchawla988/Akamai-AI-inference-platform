apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ai-platform
  labels: {app: gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/YOUR_GH_USER/ai-gateway:latest
          ports:
            - {containerPort: 8080, name: http}
          env:
            - {name: VLLM_URL, value: "http://vllm.ai-platform.svc.cluster.local:8000"}
            - {name: MODEL_NAME, value: "mistralai/Mistral-7B-Instruct-v0.2"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /metrics, port: 8080}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ai-platform
  labels: {app: gateway}
spec:
  selector: {app: gateway}
  ports:
    - {name: http, port: 8080, targetPort: 8080}

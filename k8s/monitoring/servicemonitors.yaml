apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: ai-platform
spec:
  selector:
    matchLabels: {app: vllm}
  endpoints:
    - {port: http, path: /metrics, interval: 5s}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway
  namespace: ai-platform
spec:
  selector:
    matchLabels: {app: gateway}
  endpoints:
    - {port: http, path: /metrics, interval: 5s}

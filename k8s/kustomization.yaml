apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespaces.yaml
  - 01-vllm.yaml
  - 02-gateway.yaml
  - 03-ui.yaml
# 04-ingress.yaml is optional — add it here if you use ingress instead of the LoadBalancer.
images:
  - name: ghcr.io/YOUR_GH_USER/ai-gateway
    newName: ghcr.io/YOUR_GH_USER/ai-gateway
    newTag: latest
  - name: ghcr.io/YOUR_GH_USER/ai-ui
    newName: ghcr.io/YOUR_GH_USER/ai-ui
    newTag: latest
